name: Build Kernel-SU SUSFS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_VERSION: "15"
      KERNEL_VERSION: "4.19"
      DEFCONFIG: "gale_defconfig"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Installing dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y flex git ccache automake lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib python3-networkx libxml2-utils bzip2 libbz2-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool optipng libssl-dev python-is-python3 python3-virtualenv clang-format clang-tidy clang-tools clang clangd libc++-dev libc++1 libc++abi-dev libc++abi1 libclang-dev libclang1 liblldb-dev libllvm-ocaml-dev libomp-dev libomp5 lld lldb llvm-dev llvm-runtime llvm python3-clang
          sudo apt-get install bc gcc-aarch64-linux-gnu

      - name: Setup toolchain
        run: |
          # Clone Proton Clang for LTO/Ccache
          git clone https://gitlab.com/LeCmnGend/proton-clang -b clang-18 --depth=1 "${{ github.workspace }}/proton-clang"

          # Install 'repo' tool
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo

          # Persist PATH for all steps
          echo "$HOME/.bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/proton-clang/bin" >> $GITHUB_PATH

      - name: Configure kernel and apply SUSFS flags
        run: |
          # Initial defconfig
          make O=out ARCH=arm64 $DEFCONFIG

          # Append SUSFS flags
          CONFIG_FILE="$(pwd)/out/.config"
          echo "CONFIG_KSU_SUSFS=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$CONFIG_FILE"

          # Refresh .config
          make O=out ARCH=arm64 olddefconfig

      - name: Apply syscall-hooks.patch
        run: |
          # Fetch syscall_hooks.patch directly from SukiSU-Ultra repo
          curl -fsSL https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/hooks/syscall_hooks.patch -o syscall_hooks.patch
          patch -p1 < syscall_hooks.patch

      - name: Apply SUSFS4KSU backport patches
        run: |
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-${KERNEL_VERSION} susfs4ksu
          cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-${ANDROID_VERSION}-${KERNEL_VERSION}.patch ./
          cp -r susfs4ksu/kernel_patches/fs/* fs/
          cp -r susfs4ksu/kernel_patches/include/linux/* include/linux/
          rm -rf susfs4ksu

      - name: Build kernel
        run: |
          chmod +x build_kernel.sh
          bash build_kernel.sh

      - name: Package kernel
        id: package
        run: |
          ZIP_NAME="aquamarine-kernel-gale-$(date +%Y%m%d-%H%M)-run-${{ github.run_number }}-ksu-susfs.zip"
          SHORT_NAME="${ZIP_NAME%.zip}"

          git clone --depth=1 -b susfs https://github.com/kagiyanagi/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/{.git,.github,LICENSE,README.md}

          KERNEL_OUT="out/arch/arm64/boot"
          if [[ -f "$KERNEL_OUT/Image.gz" ]]; then
            cp "$KERNEL_OUT/Image.gz" AnyKernel3/
          elif [[ -f "$KERNEL_OUT/Image" ]]; then
            cp "$KERNEL_OUT/Image" AnyKernel3/
          else
            echo "Error: neither Image.gz nor Image found in $KERNEL_OUT" >&2
            exit 1
          fi

          if [[ -f "$KERNEL_OUT/dtbo.img" ]]; then
            cp "$KERNEL_OUT/dtbo.img" AnyKernel3/
          fi

          cd AnyKernel3
          zip -r "../$ZIP_NAME" .
          cd ..

          echo "zip=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "artifact_name=$SHORT_NAME" >> $GITHUB_OUTPUT

      - name: Upload to GoFile
        id: gofile
        run: |
          curl -fsSL https://raw.githubusercontent.com/Sushrut1101/GoFile-Upload/master/upload.sh -o upload.sh
          chmod +x upload.sh
          URL=$(bash upload.sh "${{ steps.package.outputs.zip }}")
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "GoFile download link: $URL"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: AnyKernel3/**
